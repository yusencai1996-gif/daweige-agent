appId: host.daweige.app
productName: 大微阁
copyright: Copyright © 2026 daweige

# 更新源(agent.daweige.host:根路径留给官网下载页;/update/ 放更新包)
publish:
  - provider: generic
    url: https://agent.daweige.host/update/

directories:
  output: release-v8
  buildResources: build

files:
  - out/**
  - package.json
  - "!**/*.map"

# 用户数据(userData:SQLite/密文/记事)由 Electron 运行期写入 %APPDATA%,绝不打进安装包
asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 大微阁
  deleteAppDataOnUninstall: false
