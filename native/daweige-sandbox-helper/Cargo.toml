[package]
name = "daweige-sandbox-helper"
version = "0.4.0"
edition = "2021"
description = "大微阁沙箱命令执行器(Restricted Token 一期):Electron 主进程经 stdin/stdout JSON 帧驱动,用户命令只在本进程内以受限令牌启动"
license = "MIT"

# 精准锁定:helper 是安全边界,依赖变动必须人工审查
[dependencies]
base64 = "0.22.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.141"
windows-sys = { version = "0.61.1", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Environment",
    "Win32_System_Pipes",
] }

[profile.release]
lto = true
strip = true
panic = "abort"
